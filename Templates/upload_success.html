<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Parsed Successfully - AI Interview Prep</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-purple: #7F56D9;
            --primary-hover: #6941C6;
            --bg-light: #ffffff;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-dark: #0f172a;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 750px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0284c7;
            margin-bottom: 12px;
        }

        .skill-tag {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            color: #0284c7;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 5px;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-dark);
            font-family: monospace;
            font-size: 13px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #0284c7;
        }

        .btn-action {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.2);
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.3);
        }

        .footer-action {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1><i class="fa-solid fa-circle-check" style="color: #16a34a;"></i> Resume Parsed Successfully! 🎯</h1>

        <!-- Extracted Skills Section -->
        <div class="card">
            <h3><i class="fa-solid fa-code"></i> Extracted Core Skills (RegEx Match)</h3>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                {% for skill in skills %}
                    <span class="skill-tag"><i class="fa-solid fa-terminal"></i> {{ skill }}</span>
                {% endfor %}
            </div>
        </div>

        <!-- Preview Section -->
        <div class="card">
            <h3><i class="fa-solid fa-file-lines"></i> Extracted Text Preview</h3>
            <textarea readonly>{{ resume_text }}</textarea>
        </div>

        <!-- Action Button -->
        <div class="footer-action">
            <a href="{{ url_for('assessment') }}" class="btn-action">
                Proceed to Initial Assessment (25 Qs) <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>
    </div>

</body>
</html>
